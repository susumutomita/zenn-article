name: lint

on:
  push:
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup safe-chain
        run: |
          pnpm add -g --ignore-scripts @aikidosec/safe-chain@1.5.3
          safe-chain setup-ci

      - name: Install dependencies
        run: |
          make install

      - name: Lint and validate books
        run: |
          set +e
          make before_commit > /tmp/before-commit.log 2>&1
          status=$?
          cat /tmp/before-commit.log
          exit "$status"

      - name: Generate textlint autofix diagnostics
        if: failure()
        run: |
          set +e
          pnpm run lint:fix > /tmp/lint-fix.log 2>&1
          cp -R books/cloud-competition /tmp/cloud-competition-fixed
          tar -czf /tmp/cloud-competition-diagnostics.tar.gz \
            -C /tmp before-commit.log lint-fix.log cloud-competition-fixed

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-competition-lint-diagnostics
          path: /tmp/cloud-competition-diagnostics.tar.gz
          if-no-files-found: error
          retention-days: 1
