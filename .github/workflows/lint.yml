name: lint

on:
  push:
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup safe-chain
        run: |
          pnpm add -g --ignore-scripts @aikidosec/safe-chain@1.5.3
          safe-chain setup-ci

      - name: Install dependencies
        run: |
          make install

      - name: Apply cloud competition prose fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/book/cloud-competition-draft'
        run: |
          pnpm run lint:fix || true
          python scripts/fix-cloud-competition-draft.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/cloud-competition
          if ! git diff --cached --quiet; then
            git commit -m "docs: fix cloud competition prose lint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Lint and validate books
        run: |
          set +e
          make before_commit > /tmp/before-commit.log 2>&1
          status=$?
          cat /tmp/before-commit.log
          exit "$status"

      - name: Generate textlint diagnostics
        if: failure()
        run: |
          set +e
          cp -R books/cloud-competition /tmp/cloud-competition-current
          tar -czf /tmp/cloud-competition-diagnostics.tar.gz \
            -C /tmp before-commit.log cloud-competition-current

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-competition-lint-diagnostics
          path: /tmp/cloud-competition-diagnostics.tar.gz
          if-no-files-found: error
          retention-days: 1
