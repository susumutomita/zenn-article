name: debug-chapter1-lint

on:
  push:
    branches:
      - book/cloud-competition-draft

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup safe-chain
        run: |
          pnpm add -g --ignore-scripts @aikidosec/safe-chain@1.5.3
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install

      - name: Capture chapter lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm exec textlint books/cloud-competition/chapter1.md > chapter1-lint.txt 2>&1
          status=$?
          cat chapter1-lint.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-lint-output
          path: chapter1-lint.txt

      - name: Fail when textlint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
