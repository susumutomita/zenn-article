name: commit-cloud-book-finalization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/commit-cloud-book-finalization.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout book branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: book/cloud-competition-draft
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - name: Execute finalization script
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/run-finalize-cloud-book.yml').read_text(encoding='utf-8')
          marker = '      - name: Connect manuscript to Cloud Rescue implementation\n'
          section = workflow.index(marker)
          start = workflow.index('        run: |\n', section) + len('        run: |\n')
          end = workflow.index('      - name: Validate book\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<cloud-book-finalization>', 'exec'), {'__name__': '__main__'})
      - name: Capture validation output
        shell: bash
        run: |
          set +e
          make before_commit > cloud-book-finalization-lint.txt 2>&1
          echo $? > cloud-book-finalization-status.txt
          exit 0
      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: cloud-book-finalization-lint
          path: |
            cloud-book-finalization-lint.txt
            cloud-book-finalization-status.txt
      - name: Commit manuscript
        run: |
          rm -f .github/workflows/finalize-cloud-competition-ja.yml
          rm -f .github/workflows/run-finalize-cloud-book.yml
          rm -f .github/workflows/commit-cloud-book-finalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/cloud-competition .github/workflows/finalize-cloud-competition-ja.yml .github/workflows/run-finalize-cloud-book.yml .github/workflows/commit-cloud-book-finalization.yml
          git commit -m "docs: connect Japanese book to Cloud Rescue implementation"
          git push origin HEAD:book/cloud-competition-draft
