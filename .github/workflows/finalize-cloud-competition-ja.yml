本書では、**Cloud Rescue — 障害中のWeb APIを復旧せよ**を通し題材として扱います。実装の正本はTenkaCloudChallengeの次の2ディレクトリです。

- Challenge: `challenges/cloud-rescue`
- Battle: `battles/cloud-rescue-battle`

Challengeは、EC2、network、Python APIが正常で、nginxだけが停止した状態から始まります。APIの`/recovery`はlocalhostのnginxがHTTP 200を返した場合だけ、デプロイごとのflagを返します。

Battleは、nginx frontendとPython APIを継続採点します。`frontend-down`と`api-down`の2種類のdisruptionを持ち、どちらも対象チームのEC2だけに作用し、10分後に自動revertします。operator向けのtargeting規律と中止条件は`redteam/README.md`へ分離しています。

この2問題は、最小サンプル`hello-world`と`hello-world-battle`から設計を育てた完成例です。第4章では、その作成過程を再現するため、サンプルを複製するところから説明します。

## 検証状態を3段階に分ける

本書では、実装済み、静的検証済み、実AWS検証済みを同じ意味で使いません。

### 実装済み

次がTenkaCloudChallenge上に存在します。

