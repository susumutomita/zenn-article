name: finalize-cloud-competition-ja

on:
  push:
    branches:
      - book/cloud-competition-draft
    paths:
      - .github/workflows/finalize-cloud-competition-ja.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: book/cloud-competition-draft
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Update manuscript to the real implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          base = Path('books/cloud-competition')

          chapter1 = base / 'chapter1.md'
          source = chapter1.read_text(encoding='utf-8')
          before = '''ただし、ゼロから巨大なtemplateを書くのではありません。TenkaCloudChallengeに含まれる、動作する最小サンプルを複製して育てます。

- Challengeの基準: `challenges/hello-world`
- Battleの基準: `battles/hello-world-battle`

Battle側は、EC2上のnginxと小さなPython APIを監視する既存サンプルです。参加者は`SSM Session Manager`で接続し、停止したサービスを復旧します。本書ではこの構成をCloud Rescueとして読み替え、学習目標、物語、採点、ヒント、障害注入を順に設計します。'''
