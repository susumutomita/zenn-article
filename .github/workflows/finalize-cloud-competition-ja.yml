PRがmainへmergeされた後は、リンク内のbranchを`main`へ読み替えてください。

## Challengeで実装したもの

初期状態では、同じEC2上のPython APIは正常ですが、nginxは停止しています。

```text
FrontendUrl /          -> failure
ApiUrl /healthz        -> HTTP 200
```

参加者はSSM Session ManagerでEC2へ接続します。`systemctl`と`journalctl`で状態を確認し、既存のnginxを復旧します。

```text
http://localhost:8080/recovery
```

このendpointは、localhostのnginxがHTTP 200を返すまでHTTP 503を返します。正常化すると、デプロイごとの`TC{...}`を返します。TenkaCloudはCloudFormation Outputの`RecoveryFlag`を正解として採点します。

Challengeでは、flagは調査から復旧までの導線を作ります。ただし、参加者がEC2内で強い権限を持つ以上、flagだけで正常状態の継続を完全には証明できません。その役割はBattleへ分けます。

## Battleで実装したもの

Battleでは、Participant Portalへ次の2 endpointを登録します。

- frontend: `/`
- API: `/healthz`

両方がHTTP 200を返す採点周期では加点し、失敗中は減点します。運営は次の障害を対象チームだけへ実行できます。

| disruption | 操作 | 自動revert |
| --- | --- | --- |
| `frontend-down` | nginxを停止 | 600秒後に起動 |
| `api-down` | `tenkacloud-api`を停止 | 600秒後に起動 |

障害のtargeting規律、復旧経路、中止条件は`redteam/README.md`に記載しています。

## CIで証明する範囲

TenkaCloudChallengeのCIは、metadata、CloudFormation参照、security checks、catalog index、cost report、course drift、Simulator compatibilityを検査します。

CIが成功しても、AWS上でUserDataが最後まで動くことや、採点Lambdaからpublic endpointへ到達できることまでは証明できません。

