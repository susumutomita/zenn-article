          source = source.replace('| 第10章 | uptime採点 | `battles/hello-world-battle/metadata.json` |', '| 第10章 | uptime採点 | `battles/cloud-rescue-battle/metadata.json` |')
          source = source.replace('| 第11章 | phasesとdisruptions | `hello-world-battle`、`microservice-migration-battle`、`stackstack` |', '| 第11章 | phasesとdisruptions | `cloud-rescue-battle`、`microservice-migration-battle`、`stackstack` |')
          guide.write_text(source, encoding='utf-8')

