name: fix-cloud-book-lint

on:
  push:
    branches:
      - book/cloud-competition-draft
    paths:
      - .github/workflows/fix-cloud-book-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: book/cloud-competition-draft
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Fix remaining textlint findings
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "books/cloud-competition/good-problems.md": [
                  (
                      "反対に、難しくても学びが残らない問題があります。",
                      "反対に、難しくても学びを残せない問題があります。",
                  ),
              ],
              "books/cloud-competition/event-metrics.md": [
                  (
                      "観察対象が広すぎる可能性があります。",
                      "観察対象は広すぎる可能性があります。",
                  ),
                  (
                      "復旧操作自体が難しい可能性があります。",
                      "復旧操作自体は難しい可能性があります。",
                  ),
                  (
                      "初動の得点が強すぎる可能性があります。",
                      "初動の得点は強すぎる可能性があります。",
                  ),
                  (
                      "前提知識の差が大きすぎる可能性があります。",
                      "前提知識の差は大きすぎる可能性があります。",
                  ),
                  (
                      "変更によって、問題の意味が変わる場合があります。",
                      "変更内容によっては、問題の意味も変わります。",
                  ),
              ],
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for before, after in file_replacements:
                  if before not in source:
                      raise RuntimeError(f"Expected text not found in {filename}: {before}")
                  source = source.replace(before, after, 1)
              path.write_text(source, encoding="utf-8")

      - name: Validate
        run: make before_commit

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/cloud-competition/good-problems.md books/cloud-competition/event-metrics.md
          git commit -m "docs: fix remaining cloud book lint errors"
          git push origin HEAD:book/cloud-competition-draft
