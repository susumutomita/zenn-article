name: fix-restructure-lint

on:
  push:
    branches:
      - book/cloud-competition-draft
    paths:
      - .github/workflows/fix-restructure-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: book/cloud-competition-draft
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Rewrite lint findings
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "books/cloud-competition/battle-experience.md": [
                  (
                      "Challengeでは、参加者が一つの問題を理解して完了することを重視します。Battleでは、複数チームが同じ時間軸で状態を維持し、再発へ対応します。運営側も、障害注入、全体アナウンス、公平性、観客への見せ方を設計する必要があります。",
                      "Challengeでは、参加者が1つの問題を理解して完了することを重視します。Battleでは、複数チームが同じ時間軸で状態を維持し、再発へ対応します。運営側は、障害注入、全体アナウンス、公平性、観客への見せ方も設計します。",
                  ),
                  ("そこで、競技を三つの段階へ分けます。", "そこで、競技を3つの段階へ分けます。"),
                  ("SSM Session Manager", "SSMセッションマネージャー"),
                  ("習熟度に応じた演習に向きます。", "習熟度別の演習に向きます。"),
              ],
              "books/cloud-competition/good-problems.md": [
                  (
                      "良い問題は、参加者に体験してほしい判断を必要とします。さらに、その判断に必要な証拠を環境の中へ置きます。参加者が仮説を立て、証拠を確認し、操作した結果をすぐ観測できることが重要です。",
                      "良い問題は、参加者に体験してほしい判断を必要とします。さらに、その判断に必要な証拠を環境の中へ置きます。参加者は仮説を立て、証拠を確認し、操作結果をすぐ観測します。この流れが重要です。",
                  ),
                  ("エラーの理由を完全に隠す", "エラーの理由を隠しすぎる"),
                  (
                      "参加者が新しいEC2やLoad Balancerを手作業で作ると、競技終了後にリソースが残る可能性があります。また、学習目標が「復旧」なのか「構築」なのかも曖昧になります。",
                      "参加者が新しいEC2やLoad Balancerを手作業で作ると、競技終了後もリソースは残る可能性があります。また、学習目標が「復旧」なのか「構築」なのかも曖昧になります。",
                  ),
              ],
              "books/cloud-competition/scoring-design.md": [
                  (
                      "復旧速度だけに点数を付けると、参加者は原因を確認せずに再起動を試すかもしれません。正常状態の維持だけに点数を付けると、初動で遅れたチームが逆転できない場合があります。ヒントの減点が大きすぎると、学習するより黙って止まる方を選ぶ参加者も出ます。",
                      "復旧速度だけに点数を付けると、参加者は原因を確認せず、再起動を先に試します。正常状態の維持だけを報いると、初動で遅れたチームは逆転しにくくなります。ヒントの減点が大きすぎる場合、参加者は学習するより黙って止まる方を選びます。",
                  ),
                  (
                      "この方式では、正解コマンドを知っているだけでは勝てません。復旧後に状態を確認し、再発へ対応する必要があります。",
                      "この方式では、正解コマンドを知っているだけでは勝てません。復旧後に状態を確認し、再発へ対応します。",
                  ),
                  ("例として、二つのendpointを一分ごとに確認し", "例として、2つのendpointを1分ごとに確認し"),
                  ("この試算を行うと", "この条件を試算すると"),
                  ("ヒントを三段階に分けます。", "ヒントを3段階に分けます。"),
                  ("そのため、一回の競技スコアだけで", "そのため、1回の競技スコアだけで"),
              ],
              "books/cloud-competition/event-metrics.md": [
                  (
                      "全チームが低得点だった場合、問題が難しかったとは限りません。ログインできなかった、AWSアカウントを間違えた、endpoint登録の場所が分からなかった、採点が止まったという可能性もあります。",
                      "全チームが低得点でも、問題が難しいとは限りません。ログイン失敗、AWSアカウントの誤り、endpoint登録の迷い、採点停止も原因になります。",
                  ),
                  (
                      "反対に、全チームが高得点でも、学習目標を達成したとは限りません。問題文に正解コマンドが書かれていた、固定flagが共有された、強い権限で環境を作り直した場合もあります。",
                      "反対に、全チームが高得点でも、学習目標を達成したとは限りません。問題文に正解コマンドがあり、固定flagも共有されていた場合があります。強い権限で環境を作り直した場合も、高得点になります。",
                  ),
                  ("SSM Session Manager", "SSMセッションマネージャー"),
                  (
                      "反対に、再発時も同じ時間がかかる場合は、正解コマンドだけを一度実行し、調査の流れを理解していないかもしれません。",
                      "反対に、再発時も同じ時間がかかる場合は、正解コマンドだけを1度実行し、調査の流れを理解していない可能性があります。",
                  ),
                  (
                      "前提知識の差が大きすぎるかもしれません。Challengeで基本操作を分離し、Battle開始時の条件をそろえます。",
                      "前提知識の差が大きすぎる可能性があります。Challengeで基本操作を分離し、Battle開始時の条件をそろえます。",
                  ),
                  (
                      "問題作者が正解を説明する前に聞くことが重要です。解説を聞いた後では、参加者の記憶が正解手順へ寄ってしまいます。",
                      "問題作者が正解を説明する前に、参加者へ質問します。この順序が重要です。解説を聞いた後では、参加者の記憶は正解手順へ寄ってしまいます。",
                  ),
              ],
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              source = path.read_text(encoding="utf-8")
              for before, after in file_replacements:
                  if before not in source:
                      raise RuntimeError(f"Expected text not found in {filename}: {before}")
                  source = source.replace(before, after, 1)
              path.write_text(source, encoding="utf-8")

      - name: Apply safe textlint fixes
        run: |
          pnpm exec textlint --fix \
            books/cloud-competition/battle-experience.md \
            books/cloud-competition/good-problems.md \
            books/cloud-competition/scoring-design.md \
            books/cloud-competition/event-metrics.md || true

      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/cloud-competition
          git commit -m "docs: fix lint findings in restructured chapters"
          git push origin HEAD:book/cloud-competition-draft
